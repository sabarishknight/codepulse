name: Refresh GitHub metrics

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *" # hourly

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python -m pipeline.etl
        env:
          GITHUB_TOKEN: ${{ secrets.CODEPULSE_GITHUB_TOKEN }}
          CODEPULSE_REPOS: ${{ vars.CODEPULSE_REPOS }}
          CODEPULSE_DB_PATH: data/codepulse.db

      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/codepulse.db
          git diff --cached --quiet || git commit -m "chore: refresh GitHub metrics"
          git push
